# Publishes a release to PyPI when a tag `v<version>` is pushed. No token is stored anywhere: PyPI
# trusts the OIDC identity of this repository's `pypi` environment, registered once on pypi.org as a
# trusted publisher (owner ivermin1123, repository attestql, workflow release.yml, environment pypi).
# The same gate as `just check` runs first, the wheel is installed and asked its version before
# anything is uploaded, so a tag that does not match pyproject.toml stops here with nothing published.
#
# Every action is pinned to the commit SHA of the release named in the trailing comment. This
# workflow holds the right to publish, so a tag moved under it is the one supply chain move that
# would matter; a SHA cannot move. Dependabot updates the pin and the comment together.
name: release

on:
  push:
    tags: ["v*"]

# A run that reaches PyPI is not safe to cancel halfway, so a second push of the same tag waits for
# the first to finish rather than replacing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: uv sync --locked
      - run: just check

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv build
      # The demo is run here because it is the one command that reads the package's own data
      # files: a wheel that carried the code and not fixture.sql, questions.json and
      # predictions.json would install, state its version and then fail on the first command
      # a reader is given. It exits 1 over this sandbox, which is the finding and not an
      # error, so the status is kept rather than ending the step.
      - name: The wheel installs on its own, states the tag and runs the demo
        run: |
          uv tool install dist/attestql-*.whl
          installed="$("$(uv tool dir --bin)/attestql" --version)"
          echo "$installed"
          test "$installed" = "attestql ${GITHUB_REF_NAME#v}"
          status=0
          demo="$("$(uv tool dir --bin)/attestql" demo --out "$RUNNER_TEMP/demo")" || status=$?
          echo "$demo"
          test "$status" -eq 1
          echo "$demo" | grep -q "6 questions: 3 NOT_EQUAL"
          grep -q '"NOT_EQUAL": 3' "$RUNNER_TEMP/demo/audit/summary.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The GitHub release exists so a tag on PyPI has a page on this repository too. It is a separate
  # job from `publish` so that the right to write to the repository is never held by the job that
  # holds the right to upload, and it needs `publish` so a failed upload never announces itself.
  # The body is whatever GitHub generates from the commits: the owner writes notes by hand when a
  # release deserves them, and a generated body is the honest fallback rather than an invented one.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release for this tag unless one is already there
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a GitHub release; leaving the notes that are there"
            exit 0
          fi
          if ! gh release create "$tag" --title "attestql ${tag#v}" --generate-notes; then
            gh release view "$tag" >/dev/null 2>&1 || exit 1
            echo "$tag was given a GitHub release while this job ran; leaving it as written"
          fi

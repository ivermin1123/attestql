[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attestql"
version = "0.3.1"
description = "Audit text-to-SQL gold and predictions on PostgreSQL or SQLite with typed replay evidence."
readme = "README.md"
authors = [{ name = "Hoang Le", email = "ivermin1123@gmail.com" }]
keywords = [
    "text-to-sql",
    "sql",
    "audit",
    "benchmark",
    "evaluation",
    "postgresql",
    "sqlite",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "psycopg[binary]>=3.3.5,<4",
    # The audit's parser: a BSD-2-Clause binding to libpg_query, which is PostgreSQL's own
    # grammar compiled as a library, so the tool and the server read a statement the same
    # way. Pinned exactly, because the parse decides the replay rule and the ordering a
    # record states, and a parser that changed under a rerun would change the record with
    # it. The licence is the reason the previous parser was replaced: the audit parses on
    # the product path, and a GPL parser there sets the terms of everything that embeds it.
    "postgast==0.1.0",
    # The SQLite parser: sqlglot's SQLite dialect (MIT, no runtime dependency of its own).
    # SQLite ships no grammar as a library, so the tool reads a SQLite statement with a
    # parser rather than with the engine that will run it, and R-D measured this one
    # reading every gold of BIRD dev and of both Mini-Dev SQLite copies. Pinned exactly for
    # the reason the parser above is: the parse decides the replay rule and the ordering a
    # record states, and a parser that changed under a rerun would change the record.
    "sqlglot==30.18.0",
    # The report renderer's templates. `attestql report` writes the audit's own JSON out as
    # pages, and the escaping of untrusted text -- SQL from a question file, a message from a
    # server, a column name -- is what a template engine is for; a renderer built out of
    # string formatting here would be one escape nobody wrote away from serving markup that
    # came out of a prediction file. Pinned by range like the driver rather than exactly like
    # the parsers: it decides no record and no verdict, so a patch release of it changes
    # nothing a record states.
    "jinja2>=3.1.6,<4",
]

[project.urls]
Homepage = "https://github.com/ivermin1123/attestql"
Repository = "https://github.com/ivermin1123/attestql"
Documentation = "https://github.com/ivermin1123/attestql/blob/main/docs/audit-command.md"
Issues = "https://github.com/ivermin1123/attestql/issues"
Changelog = "https://github.com/ivermin1123/attestql/releases"

[project.scripts]
attestql = "attestql.audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The sandbox `attestql demo` builds and audits. Without this the wheel would hold the code
# that names the three files and none of the files, so the command the README opens with would
# fail on every machine that installed the package rather than in the gate.
[tool.setuptools.package-data]
"attestql.demo" = ["*.sql", "*.json"]
# The renderer's templates, its stylesheet, its script, the method figure and the fonts. They
# are found beside the module that renders them (`Path(__file__)`), so a wheel without them
# would hold a command that fails on the machine that installed it rather than in the gate.
# `static/*` does not reach into a directory, which is why the fonts are named separately.
"attestql.report" = ["templates/*.html", "static/*", "static/fonts/*"]
# The marker that says this package is typed. The repository type checks itself in strict
# mode, and without this file in the wheel a caller's own checker treats every import from
# it as untyped, so the checking done here would stop at the installing machine.
"attestql" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tools/site` is on the path so that `tools/site/build.py` imports as `build`. Beware: a
# plain `python` started in the repository root resolves that name to the git-ignored `build/`
# output directory instead, as an empty namespace package, so
# tests/test_site_builds_from_the_sandbox.py asserts which module it got.
pythonpath = ["src", "tools", "tools/site", "tools/site-select"]
markers = [
    "sandbox: needs the audit sandbox (tools/audit-sandbox/run.sh); skipped when ATTESTQL_AUDIT_SANDBOX is absent",
    "sandbox_sqlite: the SQLite audit sandbox (src/attestql/demo/); needs no container and is never skipped",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    # Exactly, and the version `.pre-commit-config.yaml` pins: the hook and `just lint` read
    # the same files, and two ruff versions would disagree about them.
    "ruff==0.16.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "tools"]
# The formatter would otherwise rewrite Python fences inside Markdown; documents quote code
# verbatim (evidence cited by line), so Markdown is out of ruff's scope entirely.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest expresses every assertion as a bare assert. This allowance covers S101 only.
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests", "tools"]
# `tools/site` for the same reason the pytest `pythonpath` above carries it, and with the
# same ambiguity against the git-ignored `build/` directory, which the test guards.
# `tools/site-select` joined them on 2026-09-11, once the script that shadowed the standard
# library's `select` was renamed and the directory became safe to put on a path.
extraPaths = ["src", "tools", "tools/site", "tools/site-select"]
